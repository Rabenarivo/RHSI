<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Espace Administrateur</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 40px; }
        .dashboard { background: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #dc3545; }
        .logout-btn { display: inline-block; margin-top: 20px; padding: 10px 20px; background-color: #f44336; color: white; text-decoration: none; border-radius: 4px; }
        .logout-btn:hover { background-color: #d32f2f; }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>Bienvenue sur l'Espace Administrateur</h1>
        <p>Gérez les utilisateurs et les paramètres globaux du système.</p>
        <a href="{% url 'recrutement_accounts:logout' %}" class="logout-btn">Se déconnecter</a>
    </div>
</body>
</html>
