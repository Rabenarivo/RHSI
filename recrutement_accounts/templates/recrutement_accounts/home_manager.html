<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Espace Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    {% include 'navbar.html' %}
    
    <div class="container mt-5 text-center">
        <h2>Espace Manager</h2>
        <p class="lead">Bienvenue sur votre espace de gestion d'équipe RHSI.</p>
        
        <div class="card mx-auto mt-4" style="max-width: 500px;">
            <div class="card-body">
                <h5 class="card-title">Vos informations</h5>
                <p><strong>Email :</strong> {{ request.user.email|default:request.user.username }}</p>
                <p><strong>Type de compte :</strong> {{ request.session.account_type|title }}</p>
            </div>
        </div>
    </div>
</body>
</html>
