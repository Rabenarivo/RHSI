<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Assigner un Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    {% include 'navbar.html' %}

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0">Assigner un Manager</h4>
                    </div>
                    <div class="card-body">
                        <p class="text-muted">Sélectionnez un employé et assignez-lui un manager parmi la liste des managers disponibles.</p>
                        
                        <form method="post">
                            {% csrf_token %}
                            {{ form.as_p }}
                            
                            <div class="mt-4">
                                <button type="submit" class="btn btn-success">Enregistrer l'assignation</button>
                                <a href="{% url 'recrutement_accounts:dashboard' %}" class="btn btn-secondary">Annuler</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
