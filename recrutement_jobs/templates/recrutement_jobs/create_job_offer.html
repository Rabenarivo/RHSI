<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Créer une offre d'emploi</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-container { background: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; font-weight: bold; }
        input[type="text"], input[type="email"], input[type="password"], textarea, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .btn { width: 100%; padding: 10px; background: #28a745; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .btn:hover { background: #218838; }
        .messages { margin-bottom: 15px; color: #155724; background-color: #d4edda; border-color: #c3e6cb; padding: 10px; border-radius: 4px; text-align: center; }
        .back-link { display: block; text-align: center; margin-top: 15px; text-decoration: none; color: #007bff; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Créer une offre d'emploi</h2>
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            
            <div class="form-group" style="border: 1px solid #ddd; padding: 15px; border-radius: 4px; background-color: #fafafa; margin-top: 15px;">
                <label style="margin-bottom: 10px; font-size: 1.1em; color: #444;">Compétences requises (Scores IA) - Optionnel</label>
                <p style="font-size: 0.9em; color: #666; margin-bottom: 15px;">Ajoutez des compétences et leur importance (note sur 100). Le total ne doit pas dépasser 100.</p>
                <div id="skills-container">
                    <div class="skill-row" style="display: flex; gap: 10px; margin-bottom: 10px;">
                        <input type="text" name="skill_name" placeholder="Compétence (ex: Python)" style="flex: 2;">
                        <input type="number" name="skill_note" placeholder="Note (ex: 60)" style="flex: 1;" min="1" max="100">
                    </div>
                </div>
                <button type="button" class="btn" style="background-color: #17a2b8; margin-top: 5px; width: auto; padding: 8px 15px;" onclick="addSkillRow()">+ Ajouter une compétence</button>
            </div>

            <button type="submit" class="btn" style="margin-top: 20px;">Publier l'offre</button>
        </form>
        <a href="{% url 'recrutement_jobs:list_job_offer' %}" class="back-link">Voir la liste des offres</a>
    </div>

    <script>
        function addSkillRow() {
            const container = document.getElementById('skills-container');
            const row = document.createElement('div');
            row.className = 'skill-row';
            row.style = 'display: flex; gap: 10px; margin-bottom: 10px;';
            row.innerHTML = `
                <input type="text" name="skill_name" placeholder="Compétence (ex: Django)" style="flex: 2;">
                <input type="number" name="skill_note" placeholder="Note (ex: 40)" style="flex: 1;" min="1" max="100">
                <button type="button" onclick="this.parentElement.remove()" style="background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; padding: 0 15px; font-weight: bold;">X</button>
            `;
            container.appendChild(row);
        }
    </script>
</body>
</html>
