<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Créer un Contrat</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #333; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; font-weight: bold; }
        input[type="text"], input[type="number"], input[type="date"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; font-weight: bold; transition: background 0.3s; }
        button:hover { background-color: #218838; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #007bff; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    {% include 'navbar.html' %}

    <div class="container">
        <a href="{% url 'recrutement_interviews:application_filter' %}" class="back-link">&larr; Retour aux candidatures</a>
        
        <h2>Créer un Contrat</h2>
        <p style="text-align: center; color: #666; margin-bottom: 20px;">
            Pour le candidat <strong>{{ application.candidate.first_name }} {{ application.candidate.last_name }}</strong><br>
            Poste : <strong>{{ application.job_offer.title }}</strong>
        </p>

        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="contract_type">Type de Contrat</label>
                <select id="contract_type" name="contract_type" required>
                    <option value="cdi" {% if default_contract_type == 'cdi' %}selected{% endif %}>CDI</option>
                    <option value="cdd" {% if default_contract_type == 'cdd' %}selected{% endif %}>CDD</option>
                    <option value="stage" {% if default_contract_type == 'stage' %}selected{% endif %}>Stage</option>
                    <option value="alternance" {% if default_contract_type == 'alternance' %}selected{% endif %}>Alternance</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="salary">Salaire Annuel ou Mensuel Brut (€)</label>
                <input type="number" step="0.01" id="salary" name="salary" placeholder="ex: 35000">
            </div>

            <div class="form-group">
                <label for="duration_months">Durée en mois (Pour CDD, Stage, Alternance)</label>
                <input type="number" id="duration_months" name="duration_months" placeholder="ex: 6">
            </div>

            <div class="form-group">
                <label for="start_date">Date de Début (Souhaitée)</label>
                <input type="date" id="start_date" name="start_date">
            </div>

            <div class="form-group">
                <label for="end_date">Date de Fin (Pour CDD, Stage, Alternance)</label>
                <input type="date" id="end_date" name="end_date">
            </div>

            <div class="form-group">
                <label for="status">Statut du contrat</label>
                <select id="status" name="status" required>
                    <option value="draft" selected>Brouillon</option>
                    <option value="pending_signature">En attente de signature</option>
                    <option value="active">Actif</option>
                </select>
            </div>
            
            <button type="submit">Enregistrer le Contrat</button>
        </form>
    </div>
</body>
</html>
